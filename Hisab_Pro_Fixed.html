<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B120E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hisab Pro — Enterprise Offline Ledger & POS</title>
<style>
:root{
  --ink:#0B120E; --bg:#EEF3EF; --card:#FFFFFF; --text:#0B120E; --mute:#5C6B62; --line:#D8E2DB;
  --due:#B42B3A; --due-bg:#FBE9EB; --ok:#17803F; --ok-bg:#E1F4E8; --gold:#9A6A10; --gold-bg:#FBF0D9;
  --accent:#11803F; --onaccent:#FFFFFF; --hero:#0B120E; --cash:#0B120E; --esewa:#3E9B2A; --khalti:#6B3FA8; --ecash:#C9922B;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark; --ink:#3DDC84; --bg:#070B08; --card:#101712; --text:#E8F3EC; --mute:#93A69A; --line:#1F2B24;
    --due:#FF8A95; --due-bg:#3A1C28; --ok:#3DDC84; --ok-bg:#123322; --gold:#E3B04B; --gold-bg:#3A2E14;
    --accent:#3DDC84; --onaccent:#04130A; --hero:#12301F; --cash:#E8F3EC; --esewa:#6CCB55; --khalti:#B08CF0; --ecash:#E3B04B; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding-bottom:104px}
.noscroll{overflow:hidden}
.serif{font-family:var(--serif)}
h1,h2,h3{margin:0;font-weight:600}
.amt{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mute{color:var(--mute)} .small{font-size:13px}

.top{padding:calc(env(safe-area-inset-top) + 22px) 22px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top h1{font-family:var(--serif);font-size:28px;line-height:1.15}
.top .sub{color:var(--mute);font-size:14px;margin-top:2px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font-family:var(--serif);font-size:18px;border:0;overflow:hidden;padding:0;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.role-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.role-pill.op{color:var(--gold);background:var(--gold-bg);border-color:transparent}
.sandbox-bar{background:var(--gold);color:#fff;text-align:center;font-size:12px;font-weight:700;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;display:flex;justify-content:space-between;align-items:center}
.sandbox-bar button{background:rgba(0,0,0,.25);border:0;color:#fff;border-radius:99px;padding:2px 10px;font-size:11px}

.hero{margin:14px 16px 0;background:var(--hero);color:#fff;border-radius:26px;padding:22px 22px 20px}
.hero .lbl{font-size:14px;opacity:.82}
.hero .big{font-family:var(--serif);font-size:44px;line-height:1.1;margin:4px 0 14px;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;font-size:14px}
.sw{width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.35);border:0;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:#fff}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent)}
.sw.dk{background:var(--line)}
.sw.dk::after{background:#fff}
.sw.dk[aria-checked="true"]{background:var(--accent)}
.sw.dk[aria-checked="true"]::after{background:var(--onaccent)}

.sec{margin:22px 16px 0}
.sec h2{font-family:var(--serif);font-size:20px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2 button{background:none;border:0;color:var(--accent);font:600 14px var(--sans);padding:4px 0}
.card{background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .k{color:var(--mute);font-size:13px}
.stat .v{font-family:var(--serif);font-size:23px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v.due{color:var(--due)} .stat .v.ok{color:var(--ok)}

.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);margin:12px 0}
.bar i{display:block;height:100%}
.legend{display:grid;gap:8px}
.legend div{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.legend span.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}

.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row .id{font-family:var(--serif);font-size:15px;width:62px;flex:none;color:var(--mute)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{font-size:13px;color:var(--mute)}
.row .end{text-align:right;flex:none}
.row .end .amt{font-size:17px;display:block}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;margin-top:3px}
.b-paid{background:var(--ok-bg);color:var(--ok)} .b-part{background:var(--gold-bg);color:var(--gold)} .b-due{background:var(--due-bg);color:var(--due)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.chip.go{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--mute);font-size:13px;text-align:right;padding:0 0 10px}
th:first-child,td:first-child{text-align:left}
td{padding:13px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td:first-child{font-weight:600;max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.clk{cursor:pointer}
td.left-due{color:var(--due);font-weight:600} td.left-ok{color:var(--ok)}
tfoot td{font-weight:700;border-top:2px solid var(--line)}

.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:20}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mute);padding:6px 0}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.tab svg{width:24px;height:24px}
.fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--onaccent);border:0;display:grid;place-items:center;margin:-30px auto 0;box-shadow:0 8px 20px rgba(11,18,14,.35)}
.fab svg{width:26px;height:26px}

.scrim{position:fixed;inset:0;background:rgba(10,14,35,.55);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:min(440px,100%);max-height:92vh;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);z-index:50;transition:transform .25s ease;visibility:hidden}
.sheet.on{transform:translate(-50%,0);visibility:visible}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--serif);font-size:24px;margin-bottom:4px}
@media (prefers-reduced-motion: reduce){.sheet,.toast{transition:none}.sw,.sw::after{transition:none}}

label.f{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.in{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px}
.in:focus{border-color:var(--accent);outline:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg.c2{grid-template-columns:1fr 1fr}
.seg button{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 4px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--onaccent)}
.btn{width:100%;border:0;border-radius:16px;padding:15px;background:var(--accent);color:var(--onaccent);font-weight:700;font-size:16px;margin-top:20px}
.btn:disabled{opacity:.6}
.btn.alt{background:var(--card);color:var(--text);border:1.5px solid var(--line);margin-top:10px}
.btn.danger{color:var(--due)}
.btnlink{display:flex;align-items:center;justify-content:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;font-weight:600;text-decoration:none;color:var(--text)}
.err{color:var(--due);font-size:13px;margin-top:8px;min-height:18px}
.note{background:var(--gold-bg);color:var(--gold);border-radius:14px;padding:11px 13px;font-size:13px;margin-top:12px}
.steps{margin:8px 0 0;padding-left:20px;font-size:14px}
.steps li{margin:6px 0}
code.o{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:13px;word-break:break-all}

.auth{padding:calc(env(safe-area-inset-top) + 28px) 24px 40px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.langsw{display:flex;gap:6px;justify-content:flex-end;margin-bottom:22px;align-items:center}
.langsw select{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.brand{font-family:var(--serif);font-size:46px;line-height:1;letter-spacing:-.02em}
.tag{color:var(--mute);margin:10px 0 28px;max-width:28ch}
.ledger-lines{height:46px;margin:0 0 26px;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 11px);border-radius:4px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px;font-weight:700;font-size:16px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:0;text-decoration:underline;font-size:inherit}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.code{letter-spacing:.6em;text-align:center;font-family:var(--serif);font-size:26px}
.legal{margin-top:auto;padding-top:28px;font-size:13px;color:var(--mute);text-align:center;display:grid;gap:10px}
.legal button{background:none;border:0;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;font-size:13px}

.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translate(-50%,-180%);width:min(408px,calc(100% - 24px));background:var(--ink);color:var(--onaccent);border-radius:18px;padding:14px 16px;z-index:80;transition:transform .3s ease;display:flex;gap:12px;align-items:flex-start;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.toast.on{transform:translate(-50%,0)}
.toast b{display:block}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.empty b{display:block;color:var(--text);font-family:var(--serif);font-size:18px;margin-bottom:4px}
.pays{margin:10px 0 0;padding:0;list-style:none}
.pays li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.pays li:last-child{border-bottom:0}
.xbtn{background:none;border:0;color:var(--due);padding:4px 8px;font-size:18px;line-height:1}
.kv{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;gap:12px}
.link{color:var(--accent);font-weight:600;text-decoration:none}
.who{display:flex;align-items:center;gap:14px}
.who .avatar{width:52px;height:52px;font-size:22px}
.who b{display:block}
.searchbox{margin:12px 16px 0}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 16px 0}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;font-size:12px}
.quick button svg{width:23px;height:23px;color:var(--accent)}

/* Shopkeeper Super-Features Styling */
.line-items{display:grid;gap:8px;margin-top:8px}
.line-row{display:grid;grid-template-columns:1fr 64px 84px 32px;gap:6px;align-items:center}
.line-row input{padding:10px 8px;border-radius:11px;font-size:14px}
.calc-bar{display:flex;justify-content:space-between;align-items:center;background:var(--ok-bg);color:var(--ok);padding:10px 14px;border-radius:14px;margin-top:10px;font-weight:600;font-size:14px}
.stock-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.stock-low{background:var(--due-bg);color:var(--due);border-color:transparent}
.banner{margin:12px 16px 0;background:var(--gold-bg);color:var(--gold);border-radius:16px;padding:12px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner button{background:var(--gold);color:#fff;border:0;border-radius:99px;padding:6px 12px;font-weight:600;font-size:12px;white-space:nowrap}
.banner.alert-red{background:var(--due-bg);color:var(--due)}
.banner.alert-red button{background:var(--due)}

/* Command Palette */
.cmd-modal{position:fixed;inset:0;background:rgba(10,14,35,.65);z-index:90;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.cmd-modal.on{display:flex}
.cmd-box{width:min(410px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.cmd-box input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px;background:transparent;font-size:16px}
.cmd-box input:focus{outline:none}
.cmd-list{max-height:50vh;overflow:auto;padding:8px}
.cmd-item{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border:0;background:none;border-radius:12px;text-align:left}
.cmd-item:hover,.cmd-item:focus{background:var(--bg)}
.cmd-kbd{font-size:11px;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px}

/* Hash & Audit Log */
.hash-tag{font-family:monospace;font-size:11px;color:var(--mute);background:var(--bg);padding:2px 6px;border-radius:6px}
.audit-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.audit-item:last-child{border-bottom:0}

/* receipt: always looks like paper */
.receipt{background:#fff;color:#14182e;border-radius:18px;padding:22px 20px;margin-top:14px;border:1px solid #dcdfea}
.receipt .r-shop{font-family:var(--serif);font-size:22px;font-weight:700;text-align:center}
.receipt .r-sub{text-align:center;font-size:13px;color:#555d7a}
.receipt .r-title{text-align:center;font-weight:700;margin:14px 0 10px;padding:8px 0;border-top:1px dashed #b9bed2;border-bottom:1px dashed #b9bed2}
.receipt .r-line{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:15px}
.receipt .r-line.big{font-weight:700;font-size:17px;border-top:1px solid #14182e;margin-top:8px;padding-top:10px}
.receipt .r-pays{font-size:13px;color:#555d7a;margin-top:8px}
.receipt .r-thanks{text-align:center;margin-top:16px;font-size:14px;color:#555d7a}
@media print{
  html,body{background:#fff!important}
  #app,.scrim,.toast,.cmd-modal{display:none!important}
  .sheet{position:static!important;transform:none!important;visibility:visible!important;max-height:none!important;overflow:visible!important;background:#fff!important;width:100%!important;padding:0!important;border-radius:0!important}
  .noprint,.grab{display:none!important}
  .receipt{border:0!important;margin:0!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="cmd-modal" id="cmd-modal">
  <div class="cmd-box">
    <input id="cmd-in" placeholder="Type command or search (e.g. Sale, Audit, Day Close)..." autocomplete="off">
    <div class="cmd-list" id="cmd-list"></div>
  </div>
</div>

/* ---------- Fixed-Point Integer Math Engine (Zero Floating-Point Drift) ---------- */
const toPaisa = n => Math.round((Number(n) || 0) * 100);
const fromPaisa = p => Math.round(Number(p) || 0) / 100;
const addMoney = (a, b) => fromPaisa(toPaisa(a) + toPaisa(b));

/* ---------- Cryptographic Hash Utility (SHA-256 / Deterministic Fallback) ---------- */
async function sha256Hex(str){
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');

};

const T = {

let LANG = 'en';
const t = (k, v) => {
  const dict = T[LANG] || T.en;
  const raw = dict[k] ?? T.en[k] ?? k;
  return String(raw).replace(/\{(\w+)\}/g, (m, x) => (v && v[x] != null) ? v[x] : '');
};

function applyBrowserLanguage(code){
  LANG = code;
  Store.set('hisab:lang', code);
  document.documentElement.dir = (code === 'ar' || code === 'ur') ? 'rtl' : 'ltr';
  if(!T[code] && navigator.onLine){
    if(!$('#gt-script')){
      const d = document.createElement('div'); d.id = 'google_translate_element'; d.style.display = 'none'; document.body.appendChild(d);
      window.googleTranslateElementInit = () => {
        try{
          new google.translate.TranslateElement({pageLanguage:'en', includedLanguages:Object.keys(LANG_NAMES).join(','), autoDisplay:false}, 'google_translate_element');
          setTimeout(() => triggerGT(code), 600);
        }catch(e){}
      };
      const s = document.createElement('script'); s.id = 'gt-script';
      s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
      s.onerror = () => {};
      document.head.appendChild(s);
    } else triggerGT(code);
  } else triggerGT('en');
}
function triggerGT(code){
  const sel = document.querySelector('.goog-te-combo');
  if(sel){ sel.value = code; sel.dispatchEvent(new Event('change')); }
}

  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

/* ---------- Cryptographic Chained Audit Logger ---------- */
async function logAudit(action, detail){
  const prevHash = state.auditLog.length ? state.auditLog[0].hash : '0000000000000000';
  const ts = new Date().toISOString();
  const actor = `${state.user ? state.user.email : 'local'} (${state.role})`;
  const payload = `${prevHash}|${ts}|${actor}|${action}|${detail}`;
  const hash = await sha256Hex(payload);
  state.auditLog.unshift({ts, actor, action, detail, prevHash, hash});
  if(state.auditLog.length > 250) state.auditLog.length = 250;
  save();
}

/* ---------- Automatic Point-in-Time Snapshot Engine ---------- */
async function createSnapshot(label){
  const raw = JSON.stringify(snapshotObj());
  const checksum = (await sha256Hex(raw)).slice(0, 12);
  state.snapshots.unshift({
    id: Date.now(),
    ts: new Date().toISOString(),
    label: label || 'Auto Checkpoint',
    ordersCount: state.orders.length,
    checksum,
    data: raw
  });
  if(state.snapshots.length > 8) state.snapshots.length = 8;
  save();
}

/* ---------- Derived Calculations (Fixed-Point Safe) ---------- */
const paidOf = o => fromPaisa(o.pay.reduce((a,p) => a + toPaisa(p.amt), 0));
const leftOf = o => Math.max(0, subMoney(o.total, paidOf(o)));
const statusOf = o => leftOf(o) === 0 ? 'paid' : (paidOf(o) > 0 ? 'part' : 'due');
const badge = o => { const s = statusOf(o); return `<span class="badge b-${s==='paid'?'paid':s==='part'?'part':'due'}">${s==='paid'?t('sPaid'):s==='part'?t('sPart'):t('sDue')}</span>`; };
const isDateLocked = iso => state.lockedDates.includes(dkey(iso));

function totals(){
  let soldP=0, recP=0;
  state.orders.forEach(o => { soldP += toPaisa(o.total); recP += toPaisa(paidOf(o)); });
  return {sold:fromPaisa(soldP), rec:fromPaisa(recP), left:fromPaisa(soldP - recP)};
}
function inPeriod(iso){
  const p = state.period; if(p === 'all') return true;
  const d = new Date(iso), n = new Date();
  const start = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  if(p === 'today') return d >= start;
  if(p === 'week'){ const s = new Date(start); s.setDate(s.getDate() - 6); return d >= s; }
  if(p === 'month') return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth();
  return true;
}
function periodTotals(){
  let soldP=0, recP=0, profitP=0; const byP = {cash:0, esewa:0, khalti:0, ecash:0};
  state.orders.forEach(o => {
    if(inPeriod(o.date)){
      soldP += toPaisa(o.total);
      profitP += toPaisa(o.profit != null ? o.profit : o.total * 0.2);
    }
    o.pay.forEach(p => { if(inPeriod(p.date)){ const pp = toPaisa(p.amt); recP += pp; byP[p.m] = (byP[p.m] || 0) + pp; } });
  });
  return {
    sold:fromPaisa(soldP), rec:fromPaisa(recP), profit:fromPaisa(profitP),
    by:{cash:fromPaisa(byP.cash), esewa:fromPaisa(byP.esewa), khalti:fromPaisa(byP.khalti), ecash:fromPaisa(byP.ecash)},
    left: totals().left
  };
}
function customers(){
  const map = new Map();
  state.orders.forEach(o => {
    const k = o.customer.trim().toLowerCase();
    if(!map.has(k)) map.set(k, {name:o.customer.trim(), phone:o.phone, boughtP:0, paidP:0, orders:[]});
    const c = map.get(k);
    c.boughtP += toPaisa(o.total); c.paidP += toPaisa(paidOf(o)); c.orders.push(o);
    if(o.phone) c.phone = o.phone;
  });
  return [...map.values()].map(c => ({
    ...c, bought:fromPaisa(c.boughtP), paid:fromPaisa(c.paidP)
  })).sort((a,b) => (b.boughtP - b.paidP) - (a.boughtP - a.paidP) || b.boughtP - a.boughtP);
}
const orderLabel = o => 'ORD-' + o.id;
const ageDays = o => Math.max(0, Math.floor((Date.now() - new Date(o.date)) / 86400000));
const isOverdue = o => leftOf(o) > 0 && ageDays(o) >= OVERDUE_DAYS;

/* ---------- Local Anomaly & Fraud Detection Engine ---------- */
function detectAnomalies(){
  const alerts = [];
  const seenSig = new Map();
  state.orders.forEach(o => {
    const sig = `${o.customer.toLowerCase()}|${o.total}`;
    const prev = seenSig.get(sig);
    if(prev && Math.abs(new Date(o.date) - new Date(prev.date)) < 10 * 60 * 1000){
      alerts.push({type:'Duplicate Entry', msg:`${orderLabel(o)} & ${orderLabel(prev)}: ${o.customer} for ${rs(o.total)} within 10 mins`});
    }
    seenSig.set(sig, o);
    const hr = new Date(o.date).getHours();
    if(hr >= 23 || hr < 5){
      alerts.push({type:'After-Hours Entry', msg:`${orderLabel(o)} (${o.customer}, ${rs(o.total)}) recorded at ${hr}:00`});
    }
    if(o.kind === 'credit' && o.total >= 25000 && o.total % 1000 === 0){
      alerts.push({type:'High-Value Round Credit', msg:`${orderLabel(o)}: ${rs(o.total)} credit to ${o.customer}`});
    }
  });
  return alerts;
}

let gsiPromise = null, gsiInitFor = '';
function loadGSI(){
  if(window.google && google.accounts && google.accounts.id) return Promise.resolve();
  if(gsiPromise) return gsiPromise;
  gsiPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.defer = true;
    s.onload = res; s.onerror = () => { gsiPromise = null; rej(new Error('gsi')); };
    document.head.appendChild(s);
  });
  return gsiPromise;
}
let tokenClient = null, tokenClientFor = '';
function startGoogle(hint){
  const id = clientId();
  if(!id){ sheetSetup(); return; }
  const go = () => {
    if(!tokenClient || tokenClientFor !== id){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id:id, scope:'openid email profile', callback:onGoogleToken,
        error_callback: e => { if(e && e.type === 'popup_failed_to_open') setAuthErr(t('errGPopup')); }
      });
      tokenClientFor = id;
    }
    tokenClient.requestAccessToken(hint ? {hint, prompt:''} : {prompt:'select_account'});
  };
  if(window.google && google.accounts && google.accounts.oauth2) go();
  else loadGSI().then(go).catch(() => setAuthErr(t('errGNet')));
}
async function onGoogleToken(r){
  if(r.error){ setAuthErr(t('errGFail')); return; }
  try{
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:'Bearer ' + r.access_token}});
    if(!res.ok) throw new Error('userinfo');
    const u = await res.json();
    if(!u.email) throw new Error('noemail');
    if(u.email_verified === false) return setAuthErr(t('errGUnv'));
    login({name:u.name || u.email, email:u.email, picture:u.picture || '', via:'Google'});
  }catch(e){ setAuthErr(t('errGFail')); }
}
function setAuthErr(m){ state.auth.err = m; const e = $('#autherr'); if(e) e.textContent = m; }
function login(user){

const genCode = () => String(crypto.getRandomValues(new Uint32Array(1))[0] % 900000 + 100000);
function emailCfg(){
  const c = cfg().emailjs || {};
  return {
    service: EMAILJS.service || c.service || '',
    template: EMAILJS.template || c.template || '',
    key: EMAILJS.key || c.key || '',
    reminderTemplate: EMAILJS.reminderTemplate || cfg().reminderTemplate || EMAILJS.template || c.template || ''
  };
}
async function emailSend(templateId, params){
  const e = emailCfg();
  if(!(e.service && templateId && e.key)) throw new Error('E-mail sending is not set up');
  const payload = {
    service_id: e.service,
    template_id: templateId,
    user_id: e.key,
    template_params: {
      ...params,
      email: params.to_email,
      user_email: params.to_email,
      reply_to: params.to_email,
      from_name: shopName()
    }
  };
  const r = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  if(!r.ok) throw new Error(await r.text());
}

let saleKind = 'cash', isMultiBill = false, billLines = [];
function recentChips(){
  const seen = new Set(), items = [];
  state.products.slice(0, 4).forEach(p => {
    seen.add(p.name.toLowerCase());
    items.push({item:p.name, total:p.price, pid:p.id});
  });
  for(const o of [...state.orders].reverse()){
    const k = o.item.trim().toLowerCase();
    if(!seen.has(k)){ seen.add(k); items.push({item:o.item, total:o.total}); if(items.length >= 6) break; }
  }
  window._recent = items;
  if(!items.length) return '';
  return `<div class="small mute" style="font-weight:600;margin:12px 0 6px">${t('quickAdd')}</div><div class="chips" style="padding:0;margin:0 -2px">${items.map((o,i) => `<button type="button" class="chip" data-act="pickItem" data-i="${i}">${esc(o.item)} · ${rs(o.total)}</button>`).join('')}</div>`;

function recalcBillTotal(){
  let subP = 0;
  if(isMultiBill){
    subP = billLines.reduce((a, l) => a + toPaisa(mulMoney(l.rate, l.qty)), 0);
  } else {
    subP = toPaisa(($('#s-amt') || {}).value);
  }
  const discP = toPaisa(($('#s-disc') || {}).value);
  const tax = parseFloat(($('#s-tax') || {}).value) || 0;
  const afterDiscP = Math.max(0, subP - discP);
  const grand = fromPaisa(Math.round(afterDiscP + (afterDiscP * tax / 100)));
  if(isMultiBill && $('#s-amt')) $('#s-amt').value = grand || '';
  const tend = parseFloat(($('#s-tend') || {}).value) || 0;
  const chEl = $('#change-out');
  if(chEl){
    if(tend > grand && grand > 0){
      chEl.hidden = false;
      chEl.innerHTML = `<span>${t('changeDue')}</span><b>${rs(subMoney(tend, grand))}</b>`;
    } else chEl.hidden = true;
  }
  return grand;
}

/* ---------- Day Close, Period Hard-Lock & Cash Drawer Reconciliation ---------- */
function sheetDayClose(){
  const todayStr = new Date().toDateString();
  let soldP = 0, cashInP = 0, digitalInP = 0, expP = 0;
  state.orders.forEach(o => {
    if(new Date(o.date).toDateString() === todayStr) soldP += toPaisa(o.total);
    o.pay.forEach(p => {
      if(new Date(p.date).toDateString() === todayStr){
        if(p.m === 'cash') cashInP += toPaisa(p.amt); else digitalInP += toPaisa(p.amt);
      }
    });
  });
  state.expenses.forEach(x => { if(new Date(x.date).toDateString() === todayStr) expP += toPaisa(x.amt); });
  const expectedCash = Math.max(0, fromPaisa(cashInP - expP));

  openSheet(`<h2>${t('dayClose')}</h2><div class="mute small">${t('dayCloseHint')}</div>
    <div class="card" style="margin-top:12px">
      <div class="kv"><span class="mute">${t('itemsSold')} (${t('today')})</span><b>${rs(fromPaisa(soldP))}</b></div>
      <div class="kv"><span class="mute">${t('recvCash')}</span><b style="color:var(--ok)">${rs(fromPaisa(cashInP))}</b></div>
      <div class="kv"><span class="mute">eSewa / Khalti / e-Cash</span><b>${rs(fromPaisa(digitalInP))}</b></div>
      <div class="kv"><span class="mute">${t('expensesP')} (${t('today')})</span><b style="color:var(--due)">-${rs(fromPaisa(expP))}</b></div>
      <div class="kv" style="border-top:1px solid var(--line);padding-top:10px"><b>Expected Cash in Drawer</b><b class="amt">${rs(expectedCash)}</b></div>
    </div>
    <label class="f" for="dc-open">${t('openingCash')}</label>
    <input class="in" id="dc-open" type="number" inputmode="decimal" value="0" data-expected="${expectedCash}">
    <label class="f" for="dc-act">${t('actualCash')}</label>
    <input class="in" id="dc-act" type="number" inputmode="decimal" value="${expectedCash}">
    <div class="calc-bar" id="dc-diff-bar"><span>${t('cashDiff')}</span><b>${rs(0)}</b></div>
    <button class="btn" data-act="doDayClose">${t('sendEodEmail')}</button>
    <button class="btn alt" data-act="closeSheet">${t('close')}</button>`);
}

function buildReceiptPdfBlob(o, s, left){
  const asc = v => String(v ?? '').replace(/[^\x20-\x7E]/g, '?');
  const escPdf = v => asc(v).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const wrap = (str, max) => {
    const words = asc(str).split(/\s+/), out = []; let cur = '';
    for(const w of words){
      if(!cur) cur = w;
      else if((cur + ' ' + w).length <= max) cur += ' ' + w;
      else { out.push(cur); cur = w; }
    }
    if(cur) out.push(cur);
    return out.length ? out : [''];
  };
  const lines = [];
  const addC = (txt, size, bold) => {
    const w = Math.max(24, Math.floor(320 / (size * 0.55)));
    wrap(txt, w).forEach(ln => lines.push({align:'c', txt:ln, size, bold:!!bold}));
  };
  const addLR = (l, r, size, bold) => lines.push({align:'lr', l:asc(l), r:asc(r), size, bold:!!bold});
  const addSep = (ch) => lines.push({align:'sep', ch:ch || '-'});

  addC(shopName(), 16, true);
  if(s.address) addC(s.address, 10, false);
  if(s.phone) addC('Tel: ' + s.phone, 10, false);
  if(s.pan) addC('PAN/VAT: ' + s.pan, 10, false);
  addSep('=');
  addC('RECEIPT - ' + orderLabel(o), 12, true);
  addSep('-');
  addLR('Date:', dlong(o.date), 10, false);
  addLR('Customer:', o.customer, 10, false);
  if(o.phone) addLR('Phone:', o.phone, 10, false);
  addLR('Payment:', kindLabel(o.kind), 10, false);
  addSep('-');
  wrap('Item: ' + o.item, 44).forEach((ln, i) => lines.push({align:'l', txt:ln, size:10, bold:i===0}));
  addSep('=');
  addLR('Total:', 'Rs. ' + Number(o.total || 0).toLocaleString('en-IN'), 12, true);
  addLR('Paid:', 'Rs. ' + Number(paidOf(o) || 0).toLocaleString('en-IN'), 10, false);
  addLR('Balance Due:', 'Rs. ' + Number(left || 0).toLocaleString('en-IN'), 11, true);
  if(o.pay && o.pay.length){
    addSep('-');
    lines.push({align:'l', txt:'Payments:', size:9, bold:true});
    o.pay.forEach(p => addLR('  ' + dshort(p.date) + ' (' + mLabel(p.m) + ')', 'Rs. ' + Number(p.amt || 0).toLocaleString('en-IN'), 9, false));
  }
  addSep('=');
  addC('Thank you for your business!', 10, false);

  const W = 380, H = Math.max(420, 90 + lines.length * 18);
  let y = H - 40;
  const ops = ['0.04 0.07 0.05 rg', '0.04 0.07 0.05 RG'];
  for(const ln of lines){
    const sz = ln.size || 10;
    const fnt = ln.bold ? '/F2' : '/F1';
    if(ln.align === 'sep'){
      const yLine = y + 4;
      ops.push(`${ln.ch === '=' ? '1.2' : '0.6'} w 28 ${yLine} m ${W - 28} ${yLine} l S`);
      y -= 14;
    } else if(ln.align === 'c'){
      const approxW = ln.txt.length * sz * 0.52;
      const x = Math.max(28, (W - approxW) / 2);
      ops.push(`BT ${fnt} ${sz} Tf ${x.toFixed(1)} ${y} Td (${escPdf(ln.txt)}) Tj ET`);
      y -= (sz + 6);
    } else if(ln.align === 'lr'){
      const rW = ln.r.length * sz * 0.54;
      const rx = Math.max(180, W - 28 - rW);
      ops.push(`BT ${fnt} ${sz} Tf 28 ${y} Td (${escPdf(ln.l)}) Tj ET`);
      ops.push(`BT ${fnt} ${sz} Tf ${rx.toFixed(1)} ${y} Td (${escPdf(ln.r)}) Tj ET`);
      y -= (sz + 6);
    } else {
      ops.push(`BT ${fnt} ${sz} Tf 28 ${y} Td (${escPdf(ln.txt)}) Tj ET`);
      y -= (sz + 6);
    }
  }
  const stream = ops.join('\n');
  const objs = [
    '1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj',
    '2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj',
    `3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >> endobj`,
    '4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj',
    '5 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >> endobj',
    `6 0 obj << /Length ${stream.length} >> stream\n${stream}\nendstream endobj`
  ];
  let pdf = '%PDF-1.4\n';
  const offsets = [0];
  for(const oStr of objs){
    offsets.push(pdf.length);
    pdf += oStr + '\n';
  }
  const xrefPos = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
  for(let i = 1; i <= objs.length; i++){
    pdf += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  }
  pdf += `trailer << /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
  return new Blob([pdf], {type:'application/pdf'});
}
async function saveBinaryOrTextFile(name, blob, fallbackText){
  try{
    const file = new File([blob], name, {type: blob.type || 'application/octet-stream'});
    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      await navigator.share({files:[file], title:name});
      return true;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return true;
  }
  const isWebView = /wv|WebView/i.test(navigator.userAgent || '') || (typeof window.Android !== 'undefined');
  try{
    if(!isWebView){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return true;
    }
  }catch(e){}
  try{
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
    const a = document.createElement('a');
    a.href = dataUrl; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    return true;
  }catch(e){}
  if(fallbackText != null){ showExportFallback(name, fallbackText); return false; }
  return false;
}

let audioCtx, swReg = null;
function permState(){ return ('Notification' in window) ? Notification.permission : 'unsupported'; }
function unlockAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); }catch(e){} }
function chime(){
  if(!state.remind.sound) return;
  unlockAudio();
  if(audioCtx){
    const tm = audioCtx.currentTime;
    [[880,0],[1318.5,.18],[1760,.36]].forEach(([f,d]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, tm+d); g.gain.exponentialRampToValueAtTime(.35, tm+d+.02); g.gain.exponentialRampToValueAtTime(.0001, tm+d+.6);
      o.connect(g); g.connect(audioCtx.destination); o.start(tm+d); o.stop(tm+d+.65);
    });
  }
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
}

function queueEmail(templateId, params){
  state.emailQueue.push({templateId, params, ts:Date.now()});
  save();
  if(swReg && 'sync' in swReg){ try{ swReg.sync.register('hisab-email-sync'); }catch(e){} }
}
async function flushEmailQueue(){
  if(!navigator.onLine || !state.emailQueue.length) return;
  const remaining = [];
  let sentCount = 0;
  for(const item of state.emailQueue){
    try{
      await emailSend(item.templateId, item.params);
      sentCount++;
    }catch(e){
      if(Date.now() - item.ts < 7 * 86400000) remaining.push(item);
    }
  }
  state.emailQueue = remaining;
  save();
  if(sentCount > 0) toast(t('remSent'), t('queueFlushed', {n:sentCount}));
}
window.addEventListener('online', flushEmailQueue);

let lastTry = 0, sendingRem = false;
async function sendReminderEmail(manual, customSubject, extraTitle){
  const e = emailCfg();
  if(!e.reminderTemplate){ if(manual) toast(t('remNoTpl'), t('remNoTplTxt')); return 'notemplate'; }
  if(sendingRem) return false;
  sendingRem = true;
  const to = state.remind.email || state.user.email, tt = totals();
  const subj = customSubject || (tt.left > 0 ? t('remEmailSubject',{amt:rs(tt.left)}) : t('remEmailSubjectClear'));
  const params = {to_email:to, subject:subj, message:reminderHtml(extraTitle)};
  if(!navigator.onLine){
    queueEmail(e.reminderTemplate, params);
    sendingRem = false;
    if(manual) toast('Queued offline', 'Will e-mail automatically as soon as internet connects.');
    return true;
  }
  try{
    await emailSend(e.reminderTemplate, params);
    chime();
    if(manual) toast(t('remSent'), t('remSentTxt',{email:to}));
    return true;
  }catch(err){
    queueEmail(e.reminderTemplate, params);
    const why = String((err && err.message) || '').replace(/<[^>]*>/g,'').trim().slice(0,120);
    if(manual) toast(t('remFail'), why);
    return false;
  }finally{ sendingRem = false; }
}
function timePassed(hm){
  const [h, m] = String(hm || '20:00').split(':').map(Number), d = new Date();
  return d.getHours() * 60 + d.getMinutes() >= h * 60 + m;
}
async function checkReminder(){
  const r = state.remind; if(!state.user || !r.on) return;
  const today = new Date().toDateString();
  if(r.lastFired === today || !timePassed(r.time)) return;
  if(!state.orders.length){ r.lastFired = today; save(); return; }
  if(Date.now() - lastTry < 5 * 60 * 1000) return;
  lastTry = Date.now();
  const res = await sendReminderEmail(false);
  if(res === true){ r.lastFired = today; save(); fireReminder(); }
  else if(res === 'notemplate'){ r.lastFired = today; save(); fireReminder(); }
}
setInterval(checkReminder, 30000);
document.addEventListener('visibilitychange', () => {
  if(!document.hidden){ flushEmailQueue(); checkReminder(); }
  else if(state.user && state.remind.on && state.orders.length) checkReminder();
});

  delProd(d){ state.products = state.products.filter(p => p.id !== +d.id); save(); sheetStock(); },
  dayClose(){ sheetDayClose(); },
  async doDayClose(){
    try {
      const actEl = $('#dc-act'), openEl = $('#dc-open');
      const act = actEl ? (parseFloat(actEl.value) || 0) : 0;
      const exp = openEl && openEl.dataset ? (parseFloat(openEl.dataset.expected) || 0) : 0;
      const diff = subMoney(act, exp);
      const todayKey = dkey(new Date().toISOString());
      
      if(!state.lockedDates.includes(todayKey)) state.lockedDates.push(todayKey);
      await createSnapshot(`Day Close (${todayKey})`);
      await logAudit('DAY_CLOSE_LOCKED', `Closed & locked ${todayKey} · Counted ${rs(act)} (Diff ${rs(diff)})`);
      
      closeSheet();
      render();
      toast(t('eodSent'), '');
      
      try {
        await sendReminderEmail(true, `Hisab Day Close: ${shopName()} (${dshort(new Date().toISOString())})`, `End-of-Day Cash Drawer Report · Counted: ${rs(act)} (Diff: ${rs(diff)})`);
      } catch(err) {
        console.log("Email dispatch skipped or queued:", err);
      }
    } catch(e) {
      console.error("Day Close error:", e);
      toast("Error", "Could not complete day close.");
    }
  },
  overdueNotify(){
    sendReminderEmail(true, `Hisab Overdue Dues Alert: ${shopName()}`, 'Overdue Customer Credit Summary');
  },
  openAudit(){ sheetAudit(); },
  openSnapshots(){ sheetSnapshots(); },
  async takeSnapshot(){ await createSnapshot('Manual Checkpoint'); sheetSnapshots(); toast('Snapshot Created', 'Local recovery point saved.'); },
  rollbackSnapshot(d){
    const snap = state.snapshots[+d.idx]; if(!snap) return;
    const obj = JSON.parse(snap.data);
    state.orders = obj.orders || []; state.expenses = obj.expenses || [];
    state.products = obj.products || []; state.custMeta = obj.custMeta || {};
    state.lockedDates = obj.lockedDates || [];
    recalcNext();
    logAudit('SNAPSHOT_ROLLBACK', `Restored state to ${snap.label} (${dshort(snap.ts)})`);
    closeSheet(); render();
    toast('Rollback Complete', `Restored to ${snap.label}`);
  },
  openGov(){ sheetGovernance(); },
  setRole(d){
    if(d.r === 'supervisor' && state.role === 'operator' && state.pin){
      const entered = prompt('Enter 4-digit Supervisor PIN:');
      if(entered !== state.pin) return toast('Access Denied', 'Incorrect Supervisor PIN.');
    }
    state.role = d.r;
    logAudit('ROLE_SWITCH', `Switched active role to ${d.r}`);
    sheetGovernance(); render();
  },
  savePin(){
    const p = $('#gov-pin').value.trim();
    if(p && !/^\d{4}$/.test(p)) return toast('Invalid PIN', 'Enter a 4-digit numeric PIN.');
    state.pin = p; save(); toast('Supervisor PIN Updated', p ? 'PIN protection enabled' : 'PIN cleared');
  },
  unlockDate(d){
    if(state.role !== 'supervisor') return toast('Access Denied', 'Supervisor role required to unlock periods.');
    state.lockedDates = state.lockedDates.filter(x => x !== d.dt);
    logAudit('PERIOD_UNLOCKED', `Unlocked closed period ${d.dt}`);
    sheetGovernance(); render();
  },
  toggleSandbox(){
    if(!state.sandbox){
      state.liveBackup = JSON.stringify(snapshotObj());
      state.sandbox = true;
      toast('Sandbox Active', 'Experiment freely—live ledger is safely frozen.');
    } else {
      exitSandbox();
      toast('Sandbox Exited', 'Live books restored intact.');
    }
    closeSheet(); render();
  },
  openAnomalies(){ sheetAnomalies(); },
  openCmd(){ openCmdPalette(); },
  cpm(d){ window._cpm = d.k; document.querySelectorAll('#cp-m button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === d.k)); },
  custPay(d){
    const c = customers().find(x => x.name === d.n); if(!c) return;
    const left = subMoney(c.bought, c.paid), v = parseFloat($('#cp-amt').value);
    if(!(v > 0)){ $('#cp-err').textContent = t('errPayAmt'); return; }
    if(v > left + 0.001){ $('#cp-err').textContent = t('errPayMaxC',{amt:rs(left)}); return; }
    let rest = v;
    [...c.orders].sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(o => {
      if(rest <= 0) return; const l = leftOf(o); if(l <= 0) return;
      const take = Math.min(l, rest); o.pay.push({amt:take, m:window._cpm, date:new Date().toISOString()}); rest = subMoney(rest, take);
    });
    logAudit('BULK_PAYMENT', `${rs(v)} collected from ${c.name} via ${mLabel(window._cpm)}`);
    render(); sheetCustomer(c.name); toast(t('payToast'), t('custPayTxt',{amt:rs(v), name:c.name}));
  },
  addExp(){ sheetExpense(); },
  collect(){ sheetCollect(); },
  expList(){ sheetExpList(); },
  expNote(d){ $('#x-note').value = d.v; $('#x-amt').focus(); },
  saveExp(){
    const note = $('#x-note').value.trim().slice(0,80), amt = parseFloat($('#x-amt').value);
    if(!note){ $('#x-err').textContent = t('errExpNote'); return; }
    if(!(amt > 0)){ $('#x-err').textContent = t('errExpAmt'); return; }
    const id = state.expenses.reduce((m,x) => Math.max(m, x.id), 0) + 1;
    state.expenses.push({id, note, amt, date:new Date().toISOString()});
    logAudit('EXPENSE_ADDED', `${note} · ${rs(amt)}`);
    closeSheet(); render(); toast(t('expSaved'), `${note} · ${rs(amt)}`);
  },
  delExp(d){
    if(state.role !== 'supervisor') return toast('Access Denied', 'Supervisor role required.');
    state.expenses = state.expenses.filter(x => x.id !== +d.id);
    logAudit('EXPENSE_DELETED', `Deleted expense #${d.id}`);
    render(); sheetExpList(); toast(t('expDeleted'), '');
  },
  saveEdit(d){
    const o = state.orders.find(x => x.id === +d.id); if(!o) return;
    if(isDateLocked(o.date)) return toast('Locked Period', t('periodLockedMsg'));
    const name = $('#e-name').value.trim(), item = $('#e-item').value.trim(), total = parseFloat($('#e-total').value), phone = $('#e-phone').value.trim();
    const err = m => { $('#e-err').textContent = m; };
    if(!name) return err(t('errName'));
    if(!item) return err(t('errItem'));
    if(!(total > 0)) return err(t('errAmt'));
    if(total < paidOf(o)) return err(t('errTotalLess',{amt:rs(paidOf(o))}));
    if(phone && !/^\+?\d{7,15}$/.test(phone.replace(/[\s-]/g,''))) return err(t('errPhone'));
    o.customer = name; o.item = item; o.total = total; o.phone = phone;
    logAudit('ORDER_EDITED', `Edited ${orderLabel(o)}: ${name} · ${item} · ${rs(total)}`);
    render(); sheetOrder(o.id); toast(t('updated'), orderLabel(o));
  },
  askDelOrder(d){ const o = state.orders.find(x => x.id === +d.id); if(!o) return; sheetConfirm({title:t('delT',{id:orderLabel(o)}), text:t('delTxt'), label:t('delBtn'), act:'doDelOrder', attrs:`data-id="${o.id}"`, back:o.id}); },
  doDelOrder(d){
    const o = state.orders.find(x => x.id === +d.id);
    if(o && isDateLocked(o.date)) return toast('Locked Period', t('periodLockedMsg'));
    state.orders = state.orders.filter(x => x.id !== +d.id);
    if(o) logAudit('ORDER_DELETED', `Deleted ${orderLabel(o)} (${o.customer}, ${rs(o.total)})`);
    closeSheet(); render(); if(o) toast(t('deleted',{id:orderLabel(o)}), '');
  },
  askDelPay(d){ const o = state.orders.find(x => x.id === +d.id); if(!o || !o.pay[+d.i]) return;
    sheetConfirm({title:t('delPayT'), text:t('delPayTxt',{amt:rs(o.pay[+d.i].amt), id:orderLabel(o)}), label:t('remove'), act:'doDelPay', attrs:`data-id="${o.id}" data-i="${+d.i}"`, back:o.id}); },
  doDelPay(d){
    const o = state.orders.find(x => x.id === +d.id); if(!o) return;
    const removed = o.pay.splice(+d.i, 1)[0];
    if(removed) logAudit('PAYMENT_REMOVED', `Removed ${rs(removed.amt)} payment from ${orderLabel(o)}`);
    render(); sheetOrder(o.id); toast(t('payRemoved'), orderLabel(o));
  },
  receipt(d){ sheetReceipt(+d.id); },
  shareReceipt(d){
    const o = state.orders.find(x => x.id === +d.id); if(!o) return;
    const text = receiptText(o);
    if(navigator.share){ navigator.share({title:`${t('receiptT')} ${orderLabel(o)}`, text}).catch(() => {}); return; }
    try{ navigator.clipboard.writeText(text).then(() => toast(t('copied'), t('copiedTxt')), () => toast(t('copied'), '')); }catch(e){ toast(t('copied'), ''); }
  },
  copyExportRaw(){
    const el = $('#exp-raw'); if(!el) return;
    el.select();
    try{ navigator.clipboard.writeText(el.value); toast(t('copied'), ''); }catch(e){ document.execCommand('copy'); toast(t('copied'), ''); }
  },
  async printReceipt(d){
    const o = state.orders.find(x => x.id === +(d && d.id));
    if(!o){ window.print(); return; }
    const s = state.shop, left = leftOf(o);
    const safeItem = String(o.item || orderLabel(o)).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60) || orderLabel(o);
    const fileName = safeItem + '.pdf';
    const pdfBlob = buildReceiptPdfBlob(o, s, left);
    const saved = await saveBinaryOrTextFile(fileName, pdfBlob, null);
    if(saved) toast('PDF Saved', fileName);
    else window.print();
  },
  editShop(){ sheetShop(); },
  saveShop(){ state.shop = {name:$('#sh-n').value.trim().slice(0,80), phone:$('#sh-p').value.trim().slice(0,30), address:$('#sh-a').value.trim().slice(0,120), pan:$('#sh-pan').value.trim().slice(0,30)}; closeSheet(); render(); toast(t('shopSaved'), ''); },
  toggleRemind(){ state.remind.on = !state.remind.on; if(state.remind.on) state.remind.lastFired = timePassed(state.remind.time) ? new Date().toDateString() : ''; render(); },
  toggleSound(){ state.remind.sound = !state.remind.sound; if(state.remind.sound){ unlockAudio(); chime(); } render(); },
  enableAlerts(){ enableAlerts(); },
  testRemind(){ unlockAudio(); sendReminderEmail(true); },
  logout(){ logout(); }
};

document.addEventListener('click', e => {
  if(e.target.id === 'cmd-modal'){ closeCmdPalette(); return; }
  const cmdBtn = e.target.closest('[data-cmd]');
  if(cmdBtn){
    const item = (window._cmdFiltered || [])[+cmdBtn.dataset.cmd];
    closeCmdPalette(); if(item) item.fn(); return;
  }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const f = A[el.dataset.act]; if(f) f(el.dataset, el);
});
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    if(state.user) openCmdPalette();
    return;
  }
  if(e.key === 'Escape'){ closeCmdPalette(); closeSheet(); return; }
  if(e.key !== 'Enter') return;
  if(e.target.id === 'cmd-in'){
    const first = (window._cmdFiltered || [])[0];
    closeCmdPalette(); if(first) first.fn();
  }
  else if(e.target.id === 'em') A.sendCode({}, document.querySelector('[data-act="sendCode"]'));
  else if(e.target.id === 'cd') A.verify();
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.id === 'cmd-in'){ renderCmdList(el.value); return; }
  if(el.id === 's-name') autoPhone();
  if(el.id === 's-item'){
    const prod = state.products.find(p => p.name.toLowerCase() === el.value.trim().toLowerCase());
    if(prod && $('#s-amt')){ $('#s-amt').value = prod.price; recalcBillTotal(); }
  }
  if(['s-amt','s-disc','s-tax','s-tend'].includes(el.id)) recalcBillTotal();
  if(el.dataset && el.dataset.line != null){
    const idx = +el.dataset.line, f = el.dataset.f;
    billLines[idx][f] = el.value;
    if(f === 'name'){
      const prod = state.products.find(p => p.name.toLowerCase() === el.value.trim().toLowerCase());
      if(prod){ billLines[idx].rate = prod.price; renderBillLines(); return; }
    }
    recalcBillTotal();
  }
  if(el.id === 'dc-act' || el.id === 'dc-open'){
    const open = parseFloat(($('#dc-open')||{}).value) || 0;
    const exp = addMoney(parseFloat(($('#dc-open')||{}).dataset.expected) || 0, open);
    const act = parseFloat(($('#dc-act')||{}).value) || 0;
    const diff = subMoney(act, exp);
    const bar = $('#dc-diff-bar');
    if(bar){
      bar.style.background = diff === 0 ? 'var(--ok-bg)' : 'var(--due-bg)';
      bar.style.color = diff === 0 ? 'var(--ok)' : 'var(--due)';
      bar.innerHTML = `<span>${t('cashDiff')}</span><b>${(diff > 0 ? '+' : '') + rs(diff)}</b>`;
    }
  }
  if(el.id === 'cd' && /^\d{6}$/.test(el.value)) A.verify();
  if(el.dataset && el.dataset.input === 'cq'){ state.cq = el.value; const l = $('#ctable'); if(l) l.innerHTML = customersInner(); }
  if(el.dataset && el.dataset.input === 'q'){ state.q = el.value; const l = $('#olist'); if(l) l.innerHTML = ordersListHtml(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset && el.dataset.change === 'langSelect'){
    applyBrowserLanguage(el.value); closeSheet(); render();
  }
  if(el.dataset && el.dataset.change === 'setTime'){
    state.remind.time = el.value || '20:00';
    state.remind.lastFired = timePassed(state.remind.time) ? new Date().toDateString() : '';
    save(); toast(t('remTimeSet'), t('remTimeTxt',{time:state.remind.time}));
  }
  if(el.dataset && el.dataset.change === 'remindEmail'){
    const v = el.value.trim();
    if(v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ toast(t('errEmail'), ''); return; }
    state.remind.email = v; save(); toast(t('remEmailSaved'), v || state.user.email);
  }
});

/* ---------- Safe Boot ---------- */
function boot(){
  try{
    const l = Store.get('hisab:lang');
    if(l) applyBrowserLanguage(l);
    else if((navigator.language || '').toLowerCase().startsWith('ne')) applyBrowserLanguage('ne');
    const s = Store.get('hisab:session');
    if(s && s.user && s.user.email){ openAccount(s.user); state.tab = 'home'; }
  }catch(e){ console.error(e); }
  render();
  setupSW();
  setTimeout(() => { flushEmailQueue(); checkReminder(); }, 1500);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
window.addEventListener('pageshow', () => { const app = $('#app'); if(app && !app.innerHTML.trim()) render(); });
setTimeout(() => { const app = $('#app'); if(app && !app.innerHTML.trim()) boot(); }, 350);
</script>
